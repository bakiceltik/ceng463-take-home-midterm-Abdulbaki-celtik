extends: base.yaml

question:
  id: q2_classification
  title: Classification - extreme imbalance, cost-sensitive learning, and calibration

experiment_name: credit_card_fraud_baseline
dataset:
  name: credit_card_fraud
  path: data/external/creditcard.csv
  target_column: Class
  holdout_test_size: 0.2

cross_validation:
  n_splits: 5
  shuffle: true

preprocessing:
  scale_columns:
    - Time
    - Amount
  passthrough_remainder: true

split:
  calibration_validation_fraction: 0.15

models:
  - logistic_regression
  - random_forest
  - xgboost_classifier
  - mlp_classifier

strategies:
  - no_resampling
  - smote
  - adasyn
  - random_undersampling
  - cost_sensitive

calibration:
  methods:
    - sigmoid
    - isotonic

threshold_selection:
  primary_objective: f1_max
  compare_against_cost_weighted: true
  default_decision_policy: recall_first_cost_sensitive
  false_negative_cost: 5.0
  false_positive_cost: 1.0

model_params:
  logistic_regression:
    C: 1.0
    max_iter: 2000
  random_forest:
    n_estimators: 120
    max_depth: 8
    min_samples_leaf: 2
  xgboost_classifier:
    n_estimators: 150
    max_depth: 4
    learning_rate: 0.08
    subsample: 0.9
    colsample_bytree: 0.8
    reg_lambda: 1.0
    reg_alpha: 0.0
  mlp_classifier:
    hidden_layer_sizes: [64, 32]
    alpha: 0.0005
    max_iter: 60
    learning_rate_init: 0.001
    batch_size: 2048
    early_stopping: true

tuning_ranges:
  logistic_regression:
    C: [0.5, 1.0, 2.0]
  random_forest:
    n_estimators: [80, 120, 160]
    max_depth: [6, 8, 10]
  xgboost_classifier:
    n_estimators: [100, 150, 200]
    max_depth: [3, 4, 5]
    learning_rate: [0.05, 0.08, 0.1]
  mlp_classifier:
    hidden_layer_sizes: [[64, 32], [128, 64]]
    alpha: [0.0001, 0.0005, 0.001]

analysis:
  calibration_curve_bins: 10
  threshold_grid_size: 500

report:
  write_section: true
  section_path: reports/sections/q2_classification.tex

metrics:
  - precision
  - recall
  - f1_macro
  - f1_micro
  - roc_auc
  - pr_auc
  - mcc
  - balanced_accuracy
  - brier_score
