extends: base.yaml

question:
  id: q4_clustering
  title: Clustering - GMM, cluster ensembles, and stability analysis

experiment_name: optdigits_clustering_baseline
dataset:
  name: optdigits
  path: data/external/wholesale_customers.csv
  label_column: null
  sample_size: 0

algorithms:
  - kmeans
  - gaussian_mixture
  - dbscan
  - agglomerative

selection:
  k_range: [2, 10]
  use_gap_statistic: true
  evaluate_bic_aic: true
  bootstrap_fraction: 0.8
  bootstrap_rounds: 20
  gap_reference_datasets: 10

dbscan:
  min_samples: 5
  eps_quantiles: [0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

ensemble:
  enabled: true
  n_clusters: 0
  members:
    - kmeans
    - gaussian_mixture
    - dbscan

visualisation:
  dendrogram_sample_size: 300

metrics:
  - silhouette
  - calinski_harabasz
  - davies_bouldin
  - adjusted_rand
  - normalized_mutual_info
  - fowlkes_mallows
