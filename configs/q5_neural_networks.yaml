extends: base.yaml

question:
  id: q5_neural_networks
  title: Neural networks - regularisation, transfer learning, and interpretability

experiment_name: cifar10_baseline
dataset:
  name: cifar10
  source: torchvision.datasets.CIFAR10
  data_dir: data/raw
  download: true
  train_per_class: 250
  val_per_class: 50
  test_per_class: 50

models:
  - deep_mlp
  - cnn
  - transfer_learning_resnet18

training:
  batch_size: 64
  epochs: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 2
  num_workers: 0

regularisation:
  dropout_rates: [0.3, 0.5]
  batch_norm: true
  data_augmentation:
    - random_crop
    - horizontal_flip
    - rotation

hyperparameter_optimisation:
  engine: optuna_compact_search
  max_trials: 2
  search_epochs: 1
  learning_rates: [0.001, 0.0005]
  batch_sizes: [64]
  dropout_rates: [0.3, 0.5]
  weight_decays: [0.0001]

transfer_learning:
  architecture: resnet18
  pretrained: true
  trainable_layers:
    - layer4
    - fc

interpretability:
  cnn_method: grad_cam
  mlp_method: lime
  examples_per_model: 10
  lime_examples: 1
  lime_samples: 50

robustness:
  attacks:
    - fgsm
  fgsm_epsilon: 0.03
  max_batches: 0

metrics:
  - accuracy
  - macro_f1
  - top5_error
  - confusion_matrix
  - per_class_recall
